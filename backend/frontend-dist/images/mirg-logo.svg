<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <!-- Hexágono azul -->
  <polygon points="60,75 100,50 140,75 140,125 100,150 60,125" fill="#4A90E2" stroke="none"/>
  
  <!-- Círculo interior -->
