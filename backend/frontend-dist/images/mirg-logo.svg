  <!-- Línea separadora -->
  <rect x="50" y="200" width="800" height="3" fill="#6B7B8C"/>
  
  <!-- Texto descriptivo -->
  <text x="50" y="240" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6B7B8C" letter-spacing="2px">MAQUINADOS INDUSTRIALES RAMOS GUZMÁN</text>
